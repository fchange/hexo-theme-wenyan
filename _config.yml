logo: Wenyan

navigation:
  home: /
  archives: /archives/
  friends: /friends/
  about: /about/

# Optional ordered list form. If set, this takes precedence over `navigation`.
# Useful when you need precise per-site ordering without inherited keys.
navigation_items:
#  - label: home
#    link: /
#  - label: archives
#    link: /archives/

social:
  GitHub: https://github.com/yourname
  RSS: /atom.xml

# Optional ordered list form. If set, this takes precedence over `social`.
social_items:
#  - label: GitHub
#    link: https://github.com/yourname

home:
  intro_title: Wenyan
  intro_description: A minimal Hexo theme focused on reading, rhythm, and typography.
  featured_title: featured_title

labels:
  articles_title: Articles
  table_of_contents: Table of Contents
  back_to_top: Back to top

about:
  title: Inspiration
  link: https://github.com/guangzhengli/nextjs-blog-template

toc: true

# If you want to use valine,you should get the appId and appKey form https://leancloud.cn ,more setting please see https://valine.js.org
valine:
  enable: false # set to true if you want to use Valine
  appId: # your leancloud appId
  appKey: # your leancloud appKey
  guest_info: nick,mail,link # valine comment header info
  placeholder: Leave a comment # valine comment input placeholder
  avatar: mm # gravatar style https://valine.js.org/avatar
  pageSize: 10 # comment list page size
  verify: false # valine verify code (true/false)
  notify: false # valine mail notify (true/false)
  lang: en


excerpt_num: 140

# Lightweight page motion. The article header expands from 48rem to 72rem,
# matching the upstream Next.js transition.
motion:
  header_expand: true
  duration: 500

# Footer supports ordered list links, or the legacy `footer_info` text below.
footer:
  enabled: true
  text: © Your Name
  description: Writing, design, and technology.
  links:
    GitHub: https://github.com/yourname
    RSS: /atom.xml

footer_info: © Your Name

latex: true
